<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>
    <link rel="stylesheet" href="css/cadastro.css">

</head>
<body>
    
    <div class="container">

        <form action="bemvindo.html" method="get">

            <h1>Cadastro</h1>

    

        <div class="campo">

            <label for="text">Nome Completo</label>
            <input type="text" id="text" name="nome" placeholder="Digite seu nome completo" required>

        </div>
        
     

        <div class="campo">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="Digite seu email" required>
        
        </div>

    

        <div class="campo">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        </div>

   


    <div class="campo">

        <label for="telefone">Telefone</label>
        <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone" required>

    </div>

    
    
    <div class="campo">

        <label for="nascimento">Data de Nascimento</label>
        <input type="date" id="nascimento" name="nascimento" required>

    </div>

   

    <div class="campo">

        <label>Sexo</label>

            <select>

                <option value="Feminino">Feminino</option>
                <option value="Masculino">Masculino</option>
                <option value="Outro">Outro</option>

            </select>

    

    <div class="campo">

        <label for="cidade">Cidade</label>
    
        <select id="cidade" name="cidade" required>
            <option value="">Selecione sua cidade</option>

            <option value="cidade8">Alagoinhas</option>
            <option value="cidade11">Barreiras</option>
            <option value="cidade9">Camaçari</option>
            <option value="cidade1">Feira de Santana</option>
            <option value="cidade4">Ilhéus</option>
            <option value="cidade3">Itabuna</option>
            <option value="cidade6">Juazeiro</option>
            <option value="cidade10">Porto Seguro</option>
            <option value="cidade2">Salvador</option>
            <option value="cidade7">Santo Antônio de Jesus</option>
            <option value="cidade5">Vitória da Conquista</option>
                   
        </select>

    </div>

   

    <div class="campo">

        <label for="estado">Estado</label>

        <select id="estado" name="estado" required>
            <option value="">Selecione seu estado</option>

            <option value="estado1">Bahia</option>
            <option value="estado6">Ceará</option>
            <option value="estado10">Distrito Federal</option>
            <option value="estado4">Minas Gerais</option>
            <option value="estado7">Paraná</option>
            <option value="estado5">Pernambuco</option>
            <option value="estado3">Rio de Janeiro</option>
            <option value="estado8">Rio Grande do Sul</option>
            <option value="estado9">Santa Catarina</option>
            <option value="estado2">São Paulo</option>
        </select>

    </div>


    <div class="campo">

        <label for="pais">País</label>

        <select id="pais" name="pais" required>
            <option value="">Selecione seu país</option>

            <option value="pais1">Brasil</option>
            <option value="pais2">Argentina</option>
            <option value="pais3">Chile</option>
            <option value="pais4">Colômbia</option>
            <option value="pais5">México</option>
            <option value="pais6">Peru</option>
            <option value="pais7">Uruguai</option>
            <option value="pais8">Venezuela</option>
        </select>

    </div>


    <div class="campo">
            
        <label for="obs">Observações</label>
        
        <textarea id="obs" rows="4"></textarea> 
    
    </div>
        
    <div class="campo">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Aceito os termos e condições</label>
    </div>
        
    <div class="botões">
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </div>
</form>













</body>
</html>
