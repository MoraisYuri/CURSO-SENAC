<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes</title>

<style>
    .classe1 {
        background-color: rgb(230, 116, 116);
        height: 100px;
        width: 100px;
        border: 2px dashed rgb(226, 50, 165);
    }

    .classe2 {
        background-color: red;
        height: 100px;
        width: 100px;
        border: 2px solid rgb(226, 50, 165);

    }

    .classe3 {
        background-color: blue;
        height: 50px;
        width: 50px;
        border: 1px dotted rgb(226, 50, 165);

    }



</style>

</head>
<body>
    <p id></p>


    <span class="classe1">Texto 1</span>
    <span class="classe2">Texto 2</span>
    <span class="classe3">Texto 3</span>



</body>
</html>
